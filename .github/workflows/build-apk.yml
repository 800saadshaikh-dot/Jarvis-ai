
name: Build JarvisAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          unzip -q JarvisAI_Starter.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          
